<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>resonance</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fire1: #ff4500;
    --fire2: #ff8c00;
    --fire3: #ffd700;
    --ember: #ff6b2b;
    --dark: #0a0806;
    --dark2: #12100d;
    --dark3: #1a1710;
    --dark4: #221f17;
    --panel: #1c1a14;
    --border: #2e2a1e;
    --text: #e8dfc8;
    --text-dim: #8a7f66;
    --text-dimmer: #554d3a;
    --accent: #ff6b2b;
    --online: #57f287;
    --idle: #fee75c;
    --dnd: #ed4245;
    --invis: #4f545c;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    height: 100vh;
    overflow: hidden;
  }

  /* ===================== ENTRANCE PAGE ===================== */
  #entrance {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #050403;
  }

  .entrance-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,69,0,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 80%, rgba(255,140,0,0.10) 0%, transparent 60%),
      #060504;
    z-index: 0;
  }

  .fire-particles {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 200px;
    z-index: 1;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    bottom: 0;
    width: 3px;
    border-radius: 50%;
    animation: rise linear infinite;
    opacity: 0;
  }

  @keyframes rise {
    0% { transform: translateY(0) translateX(0) scale(1); opacity:0.8; }
    50% { opacity: 0.4; }
    100% { transform: translateY(-180px) translateX(var(--dx)) scale(0.2); opacity:0; }
  }

  .banner {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 580px;
    height: 280px;
    margin-bottom: 0;
    overflow: hidden;
    border-radius: 2px 2px 0 0;
    mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
  }

  .banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    opacity: 0.85;
    filter: saturate(1.2) contrast(1.1);
  }

  .banner-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(5,4,3,0.1) 0%,
      rgba(5,4,3,0.0) 30%,
      rgba(5,4,3,0.7) 80%,
      rgba(5,4,3,1) 100%
    );
  }

  .entrance-box {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 580px;
    background: linear-gradient(180deg, #0f0d09 0%, #0a0806 100%);
    border: 1px solid #2a2518;
    border-top: none;
    padding: 32px 40px 36px;
    border-radius: 0 0 2px 2px;
  }

  .quote-line {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-align: center;
    margin-bottom: 28px;
    opacity: 0.8;
  }

  .entrance-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    text-align: center;
    margin-bottom: 20px;
  }

  .pw-field {
    width: 100%;
    background: #070605;
    border: 1px solid #2a2518;
    border-radius: 2px;
    padding: 12px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--text);
    letter-spacing: 0.1em;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 10px;
    caret-color: var(--accent);
  }

  .pw-field::placeholder { color: var(--text-dimmer); letter-spacing: 0.05em; }
  .pw-field:focus { border-color: #4a3f2a; }

  .enter-btn {
    width: 100%;
    background: linear-gradient(135deg, #2a1f0d 0%, #1a1508 100%);
    border: 1px solid var(--ember);
    border-radius: 2px;
    padding: 13px;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ember);
    cursor: pointer;
    margin-top: 14px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .enter-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,107,43,0.1), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .enter-btn:hover::before { opacity: 1; }
  .enter-btn:hover { box-shadow: 0 0 20px rgba(255,107,43,0.2); }
  .enter-btn:active { transform: scale(0.99); }

  .err-msg {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--dnd);
    text-align: center;
    margin-top: 12px;
    min-height: 16px;
    letter-spacing: 0.05em;
  }

  /* ===================== MAIN APP ===================== */
  #app {
    display: none;
    height: 100vh;
    width: 100vw;
    flex-direction: row;
  }

  /* Server list */
  #server-list {
    width: 68px;
    min-width: 68px;
    background: var(--dark2);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    gap: 8px;
    overflow-y: auto;
    border-right: 1px solid var(--border);
  }

  #server-list::-webkit-scrollbar { width: 0; }

  .server-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--dark3);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    border: 2px solid transparent;
    transition: all 0.2s;
    position: relative;
    flex-shrink: 0;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 600;
  }

  .server-icon:hover, .server-icon.active {
    border-color: var(--ember);
    border-radius: 12px;
    color: var(--ember);
  }

  .server-icon.active::before {
    content: '';
    position: absolute;
    left: -10px;
    width: 4px;
    height: 70%;
    background: var(--ember);
    border-radius: 0 3px 3px 0;
  }

  .server-divider {
    width: 32px;
    height: 1px;
    background: var(--border);
    flex-shrink: 0;
  }

  .add-server-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--dark3);
    border: 2px dashed var(--border);
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .add-server-btn:hover {
    border-color: var(--ember);
    color: var(--ember);
    border-radius: 12px;
  }

  /* Channel sidebar */
  #channel-sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--dark3);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }

  .sidebar-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-header span { font-size: 16px; }

  .channel-section {
    padding: 16px 8px 4px;
  }

  .channel-section-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    padding: 0 8px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .channel-section-title .add-ch {
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dimmer);
    transition: color 0.15s;
    line-height: 1;
  }

  .channel-section-title .add-ch:hover { color: var(--text); }

  .channel-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 14px;
    transition: all 0.15s;
    margin: 1px 0;
  }

  .channel-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .channel-item.active { background: rgba(255,107,43,0.12); color: var(--ember); }

  .channel-item .ch-icon { font-size: 12px; color: var(--text-dimmer); flex-shrink: 0; }
  .channel-item.active .ch-icon { color: var(--ember); opacity: 0.7; }

  .channel-item .ch-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }

  /* DM section in sidebar */
  .dm-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-dim);
    transition: all 0.15s;
    margin: 1px 0;
  }

  .dm-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .dm-item.active { background: rgba(255,107,43,0.12); color: var(--ember); }

  .dm-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--dark4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-family: 'Cinzel', serif;
    flex-shrink: 0;
    overflow: hidden;
  }

  .dm-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .user-bar {
    margin-top: auto;
    padding: 10px 8px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-bar-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--dark4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--ember);
    flex-shrink: 0;
    cursor: pointer;
  }

  .user-bar-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .user-bar-info {
    flex: 1;
    overflow: hidden;
    cursor: pointer;
  }

  .user-bar-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-bar-status {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-dimmer);
  }

  .user-bar-actions {
    display: flex;
    gap: 4px;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }

  .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

  /* Main chat */
  #main-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--dark);
    overflow: hidden;
  }

  .chat-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .chat-header-icon { color: var(--text-dimmer); font-size: 16px; }
  .chat-header-name { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 600; color: var(--text); }
  .chat-header-desc { font-size: 13px; color: var(--text-dimmer); margin-left: 8px; font-style: italic; }

  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-track { background: transparent; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-group {
    display: flex;
    gap: 12px;
    padding: 4px 4px;
    border-radius: 4px;
    transition: background 0.1s;
  }

  .msg-group:hover { background: rgba(255,255,255,0.02); }

  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--dark4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: var(--ember);
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
  }

  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .msg-content { flex: 1; overflow: hidden; }

  .msg-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }

  .msg-author {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ember);
    cursor: pointer;
  }

  .msg-author:hover { text-decoration: underline; }

  .msg-time {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-dimmer);
  }

  .msg-text {
    font-size: 15px;
    color: var(--text);
    line-height: 1.5;
    word-break: break-word;
  }

  .msg-continued {
    padding: 2px 4px 2px 52px;
    border-radius: 4px;
    font-size: 15px;
    color: var(--text);
    line-height: 1.5;
    word-break: break-word;
    transition: background 0.1s;
  }

  .msg-continued:hover { background: rgba(255,255,255,0.02); }

  .msg-continued .msg-time-inline {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: transparent;
    margin-right: 8px;
  }

  .msg-continued:hover .msg-time-inline { color: var(--text-dimmer); }

  /* System message */
  .sys-msg {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 4px;
    color: var(--text-dimmer);
    font-style: italic;
    font-size: 13px;
  }

  .sys-msg::before, .sys-msg::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Input area */
  .input-area {
    padding: 0 16px 16px;
    flex-shrink: 0;
  }

  .input-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 12px;
    transition: border-color 0.2s;
  }

  .input-box:focus-within { border-color: #3a3020; }

  .input-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 13px 0;
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    color: var(--text);
    caret-color: var(--ember);
  }

  .input-box input::placeholder { color: var(--text-dimmer); }

  .input-icon-btn {
    background: transparent;
    border: none;
    color: var(--text-dimmer);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.15s;
    flex-shrink: 0;
  }

  .input-icon-btn:hover { color: var(--text); }

  /* Member list */
  #member-list {
    width: 200px;
    min-width: 200px;
    background: var(--dark2);
    border-left: 1px solid var(--border);
    padding: 16px 8px;
    overflow-y: auto;
  }

  #member-list::-webkit-scrollbar { width: 0; }

  .member-section-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    padding: 0 8px 8px;
  }

  .member-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
    margin: 2px 0;
  }

  .member-item:hover { background: rgba(255,255,255,0.04); }

  .member-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--dark4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--ember);
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  .member-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .status-dot {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--dark2);
  }

  .member-name {
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* MODALS */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }

  .modal {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px;
    width: 440px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal::-webkit-scrollbar { width: 4px; }
  .modal::-webkit-scrollbar-thumb { background: var(--border); }

  .modal-title {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .modal-sub {
    font-size: 13px;
    color: var(--text-dimmer);
    margin-bottom: 20px;
    font-style: italic;
  }

  .modal-close {
    float: right;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    margin-top: -4px;
  }

  .modal-close:hover { color: var(--text); }

  .form-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    display: block;
    margin-bottom: 6px;
  }

  .form-input {
    width: 100%;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: 'Crimson Pro', serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
    caret-color: var(--ember);
  }

  .form-input:focus { border-color: #3a3020; }
  .form-input::placeholder { color: var(--text-dimmer); }

  .form-select {
    width: 100%;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: 'Crimson Pro', serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    margin-bottom: 16px;
    cursor: pointer;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 4px;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 9px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

  .btn-fire {
    background: linear-gradient(135deg, #2a1a0a, #1a1005);
    border: 1px solid var(--ember);
    border-radius: 4px;
    padding: 9px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ember);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-fire:hover { box-shadow: 0 0 12px rgba(255,107,43,0.2); }

  .btn-danger {
    background: linear-gradient(135deg, #2a0a0a, #1a0505);
    border: 1px solid var(--dnd);
    border-radius: 4px;
    padding: 9px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--dnd);
    cursor: pointer;
    transition: all 0.15s;
  }

  .avatar-upload-area {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--dark4);
    border: 2px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin: 0 auto 16px;
    overflow: hidden;
    font-size: 24px;
    color: var(--text-dimmer);
    transition: all 0.2s;
  }

  .avatar-upload-area:hover { border-color: var(--ember); color: var(--ember); }
  .avatar-upload-area img { width: 100%; height: 100%; object-fit: cover; }

  .color-swatch {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .color-swatch span {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s;
  }

  .color-swatch span.selected, .color-swatch span:hover { border-color: white; }

  /* loading */
  .loading-msg {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dimmer);
    font-style: italic;
    font-size: 13px;
    padding: 12px 4px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--ember);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Reactions */
  .msg-reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }

  .reaction {
    background: rgba(255,107,43,0.1);
    border: 1px solid rgba(255,107,43,0.2);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .reaction:hover { background: rgba(255,107,43,0.2); }

  /* Typing indicator */
  .typing-indicator {
    padding: 4px 16px 0;
    font-size: 12px;
    color: var(--text-dimmer);
    font-style: italic;
    min-height: 20px;
    flex-shrink: 0;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 900;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }

  .toast-msg {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text);
    animation: slideIn 0.2s ease, fadeOut 0.3s ease 2.5s forwards;
    pointer-events: all;
  }

  @keyframes slideIn { from { transform: translateX(100%); opacity:0; } to { transform: translateX(0); opacity:1; } }
  @keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }

  /* Scrollbar thin */
  .sidebar-channels { overflow-y: auto; flex: 1; }
  .sidebar-channels::-webkit-scrollbar { width: 3px; }
  .sidebar-channels::-webkit-scrollbar-thumb { background: var(--border); }

  /* Profile popup */
  .profile-popup {
    position: fixed;
    z-index: 600;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 280px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }

  .profile-banner {
    height: 60px;
    background: linear-gradient(135deg, var(--fire1), var(--dark3));
  }

  .profile-popup-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 3px solid var(--dark3);
    background: var(--dark4);
    margin: -28px 12px 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--ember);
  }

  .profile-popup-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .profile-popup-body { padding: 0 14px 14px; }

  .profile-popup-name {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .profile-popup-bio {
    font-size: 13px;
    color: var(--text-dim);
    margin: 6px 0;
    font-style: italic;
  }

  .profile-popup-divider {
    height: 1px;
    background: var(--border);
    margin: 10px 0;
  }

  .profile-popup-field {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-dimmer);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .profile-popup-value {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .msg-img { max-width: 320px; max-height: 240px; border-radius: 6px; margin-top: 4px; display: block; }

  .no-channel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dimmer);
    gap: 12px;
  }

  .no-channel-icon { font-size: 48px; opacity: 0.3; }
  .no-channel-text { font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.1em; }

  /* responsive */
  @media (max-width: 700px) {
    #server-list { width: 52px; min-width: 52px; }
    #channel-sidebar { width: 180px; min-width: 180px; }
    #member-list { display: none; }
    .entrance-box { padding: 24px 20px; }
    .banner { height: 200px; }
  }

  @media (max-width: 500px) {
    #channel-sidebar { display: none; }
    #channel-sidebar.show-mobile { display: flex; position: fixed; inset: 0 auto 0 52px; z-index: 200; width: 220px; }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://atmkayhfygsffuvyowub.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1ZDXFCTFiOsc8_9j0oLMCg_uHro77n4';

let sb;
try {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch(e) {
  console.error('Supabase init failed:', e);
}

// ---- State ----
let currentUser = null;
let currentServer = null;
let currentChannel = null;
let messagesChannel = null;
let typingChannel = null;
let typingTimer = null;
let lastMsgAuthor = null;
let lastMsgTime = null;

const PASSWORDS = ['resonance', 'riddle'];

// ---- Fire particles ----
(function spawnParticles() {
  const c = document.getElementById('particles');
  for(let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const hue = Math.random() < 0.5 ? '#ff4500' : (Math.random() < 0.5 ? '#ff8c00' : '#ffd700');
    const size = 2 + Math.random() * 4;
    const dur = 2 + Math.random() * 3;
    const delay = Math.random() * 4;
    const left = 10 + Math.random() * 80;
    const dx = (Math.random() - 0.5) * 60 + 'px';
    p.style.cssText = `
      left:${left}%; background:${hue};
      width:${size}px; height:${size * 2}px;
      animation-duration:${dur}s;
      animation-delay:${delay}s;
      --dx:${dx};
    `;
    c.appendChild(p);
  }
})();

// ---- Entrance ----
function tryEnter() {
  const pw = document.getElementById('pw-input').value.trim().toLowerCase();
  const name = document.getElementById('name-input').value.trim();
  const err = document.getElementById('err-msg');

  if(!PASSWORDS.includes(pw)) {
    err.textContent = '✦ wrong code ✦';
    document.getElementById('pw-input').style.borderColor = '#ed4245';
    setTimeout(() => { err.textContent = ''; document.getElementById('pw-input').style.borderColor = ''; }, 2500);
    return;
  }

  // Generate user
  const savedUser = JSON.parse(localStorage.getItem('resonance_user') || 'null');
  if(savedUser) {
    currentUser = savedUser;
    if(name && name !== savedUser.display_name) {
      currentUser.display_name = name;
      localStorage.setItem('resonance_user', JSON.stringify(currentUser));
    }
  } else {
    const id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const displayName = name || 'flame_' + Math.random().toString(36).slice(2,5);
    currentUser = {
      id,
      display_name: displayName,
      avatar_url: null,
      bio: '',
      status: 'online',
      accent_color: '#ff6b2b'
    };
    localStorage.setItem('resonance_user', JSON.stringify(currentUser));
  }

  // Upsert user to Supabase
  upsertUser(currentUser);

  document.getElementById('entrance').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initApp();
}

document.getElementById('pw-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') {
    document.getElementById('name-input').focus();
  }
});

document.getElementById('name-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') tryEnter();
});

// ---- Supabase helpers ----
async function upsertUser(user) {
  if(!sb) return;
  try {
    await sb.from('users').upsert({
      id: user.id,
      display_name: user.display_name,
      avatar_url: user.avatar_url,
      bio: user.bio || '',
      status: user.status || 'online',
      accent_color: user.accent_color || '#ff6b2b',
      last_seen: new Date().toISOString()
    }, { onConflict: 'id' });
  } catch(e) { console.log('upsert user error (likely table missing, will use local)', e.message); }
}

async function fetchServers() {
  if(!sb) return [];
  try {
    const {data, error} = await sb.from('servers').select('*').order('created_at');
    if(error) throw error;
    return data || [];
  } catch(e) { console.log('fetchServers:', e.message); return []; }
}

async function fetchChannels(serverId) {
  if(!sb) return [];
  try {
    const {data, error} = await sb.from('channels').select('*').eq('server_id', serverId).order('position');
    if(error) throw error;
    return data || [];
  } catch(e) { console.log('fetchChannels:', e.message); return []; }
}

async function fetchMessages(channelId, limit = 60) {
  if(!sb) return [];
  try {
    const {data, error} = await sb.from('messages').select('*').eq('channel_id', channelId).order('created_at', {ascending: false}).limit(limit);
    if(error) throw error;
    return (data || []).reverse();
  } catch(e) { console.log('fetchMessages:', e.message); return []; }
}

async function fetchUsers() {
  if(!sb) return [];
  try {
    const {data, error} = await sb.from('users').select('*');
    if(error) throw error;
    return data || [];
  } catch(e) { return []; }
}

async function sendMessage(content, imageUrl = null) {
  if(!sb || !currentChannel) return;
  const msg = {
    id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
    channel_id: currentChannel.id,
    author_id: currentUser.id,
    author_name: currentUser.display_name,
    author_avatar: currentUser.avatar_url,
    content: content || '',
    image_url: imageUrl || null,
    created_at: new Date().toISOString()
  };
  try {
    const {error} = await sb.from('messages').insert(msg);
    if(error) throw error;
  } catch(e) {
    // fallback: render locally
    console.log('send error:', e.message);
    renderMessage(msg, true);
  }
}

async function createServer(name, icon, description) {
  if(!sb) return null;
  const server = {
    id: 'srv_' + Date.now(),
    name,
    icon: icon || name[0].toUpperCase(),
    description: description || '',
    owner_id: currentUser.id,
    created_at: new Date().toISOString()
  };
  try {
    const {error} = await sb.from('servers').insert(server);
    if(error) throw error;
    // Create a default channel
    await sb.from('channels').insert({
      id: 'ch_' + Date.now(),
      server_id: server.id,
      name: 'general',
      type: 'text',
      position: 0,
      created_at: new Date().toISOString()
    });
    return server;
  } catch(e) {
    console.log('createServer error:', e.message);
    return null;
  }
}

async function createChannel(serverId, name, type='text') {
  if(!sb) return null;
  const ch = {
    id: 'ch_' + Date.now(),
    server_id: serverId,
    name,
    type,
    position: 99,
    created_at: new Date().toISOString()
  };
  try {
    const {error} = await sb.from('channels').insert(ch);
    if(error) throw error;
    return ch;
  } catch(e) { console.log('createChannel error:', e.message); return null; }
}

// ---- Init app ----
async function initApp() {
  updateUserBar();
  await loadServers();
  subscribeToPresence();
}

function updateUserBar() {
  const u = currentUser;
  document.getElementById('my-name-display').textContent = u.display_name;
  document.getElementById('my-avatar-text').textContent = u.display_name[0].toUpperCase();
  const statusColors = { online: '#57f287', idle: '#fee75c', dnd: '#ed4245', invisible: '#4f545c' };
  document.getElementById('my-status-display').style.color = statusColors[u.status] || '#57f287';
  document.getElementById('my-status-display').textContent = '● ' + (u.status || 'online');
  if(u.avatar_url) {
    document.getElementById('my-avatar-btn').innerHTML = `<img src="${u.avatar_url}">`;
  }
}

// ---- Servers ----
let servers = [];
let serverChannels = {};
let allUsers = {};

async function loadServers() {
  servers = await fetchServers();
  renderServerList();
  // Load all users
  const users = await fetchUsers();
  allUsers = {};
  users.forEach(u => allUsers[u.id] = u);

  if(servers.length > 0) {
    await selectServer(servers[0].id);
  }
}

function renderServerList() {
  const container = document.getElementById('server-icons');
  container.innerHTML = '';
  servers.forEach(s => {
    const el = document.createElement('div');
    el.className = 'server-icon';
    el.textContent = s.icon || s.name[0].toUpperCase();
    el.title = s.name;
    el.id = 'srv-icon-' + s.id;
    el.onclick = () => selectServer(s.id);
    container.appendChild(el);
  });
}

async function selectServer(id) {
  currentServer = servers.find(s => s.id === id) || null;
  currentChannel = null;

  // Update server icon active states
  document.querySelectorAll('.server-icon').forEach(el => el.classList.remove('active'));
  const homeEl = document.getElementById('home-server');
  if(id === '__home__') {
    homeEl.classList.add('active');
    renderHomeSidebar();
    return;
  }
  const el = document.getElementById('srv-icon-' + id);
  if(el) el.classList.add('active');

  // Load channels
  const channels = await fetchChannels(id);
  serverChannels[id] = channels;

  // Update sidebar
  document.getElementById('sidebar-title').textContent = currentServer?.name || 'resonance';
  renderChannelList(channels);
  showNoChatView();
}

function renderChannelList(channels) {
  const list = document.getElementById('channel-list');
  list.innerHTML = '';

  const section = document.createElement('div');
  section.className = 'channel-section';

  const title = document.createElement('div');
  title.className = 'channel-section-title';
  title.innerHTML = `<span>Channels</span><span class="add-ch" onclick="showCreateChannel()" title="Add channel">+</span>`;
  section.appendChild(title);

  channels.forEach(ch => {
    const el = document.createElement('div');
    el.className = 'channel-item';
    el.id = 'ch-item-' + ch.id;
    el.innerHTML = `<span class="ch-icon">${ch.type === 'voice' ? '🔊' : '#'}</span><span class="ch-name">${ch.name}</span>`;
    el.onclick = () => selectChannel(ch);
    section.appendChild(el);
  });

  list.appendChild(section);
}

function selectChannel(ch) {
  currentChannel = ch;
  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('ch-item-' + ch.id);
  if(el) el.classList.add('active');

  document.getElementById('chat-header-icon').textContent = '#';
  document.getElementById('chat-header-name').textContent = ch.name;
  document.getElementById('chat-header-desc').textContent = ch.description || '';

  showChatView();
  loadMessages(ch.id);
  subscribeToChannel(ch.id);
  subscribeTyping(ch.id);
}

function showNoChatView() {
  document.getElementById('no-channel-msg').style.display = 'flex';
  document.getElementById('chat-view').style.display = 'none';
}

function showChatView() {
  document.getElementById('no-channel-msg').style.display = 'none';
  document.getElementById('chat-view').style.display = 'flex';
  setTimeout(() => document.getElementById('msg-input').focus(), 100);
}

// ---- Messages ----
let renderedMsgIds = new Set();

async function loadMessages(channelId) {
  const area = document.getElementById('messages-area');
  area.innerHTML = '<div class="loading-msg"><div class="spinner"></div>loading messages...</div>';
  renderedMsgIds.clear();
  lastMsgAuthor = null;
  lastMsgTime = null;

  const msgs = await fetchMessages(channelId);
  area.innerHTML = '';
  msgs.forEach(m => renderMessage(m));
  scrollToBottom();
}

function renderMessage(msg, skipDupe = false) {
  if(skipDupe && renderedMsgIds.has(msg.id)) return;
  renderedMsgIds.add(msg.id);

  const area = document.getElementById('messages-area');
  const ts = new Date(msg.created_at);
  const timeStr = ts.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const dateStr = ts.toLocaleDateString([], {month:'short', day:'numeric'});
  const fullTime = dateStr + ' ' + timeStr;

  const isContinued = lastMsgAuthor === msg.author_id &&
    lastMsgTime && (ts - lastMsgTime < 5 * 60 * 1000);

  lastMsgAuthor = msg.author_id;
  lastMsgTime = ts;

  const user = allUsers[msg.author_id] || { display_name: msg.author_name, avatar_url: msg.author_avatar, accent_color: '#ff6b2b' };
  const accentColor = user.accent_color || '#ff6b2b';

  if(isContinued) {
    const el = document.createElement('div');
    el.className = 'msg-continued';
    el.dataset.msgId = msg.id;
    let html = `<span class="msg-time-inline">${timeStr}</span>`;
    if(msg.content) html += escHtml(msg.content);
    if(msg.image_url) html += `<br><img class="msg-img" src="${msg.image_url}" loading="lazy">`;
    el.innerHTML = html;
    el.addEventListener('contextmenu', e => { e.preventDefault(); showMsgMenu(e, msg); });
    area.appendChild(el);
  } else {
    const el = document.createElement('div');
    el.className = 'msg-group';
    el.dataset.msgId = msg.id;

    const initials = (msg.author_name || '?')[0].toUpperCase();
    const avatarHtml = msg.author_avatar
      ? `<img src="${msg.author_avatar}">`
      : `<span style="color:${accentColor}">${initials}</span>`;

    let bodyHtml = '';
    if(msg.content) bodyHtml += `<div class="msg-text">${escHtml(msg.content)}</div>`;
    if(msg.image_url) bodyHtml += `<img class="msg-img" src="${msg.image_url}" loading="lazy">`;

    el.innerHTML = `
      <div class="msg-avatar" onclick="showProfile('${msg.author_id}')">${avatarHtml}</div>
      <div class="msg-content">
        <div class="msg-meta">
          <span class="msg-author" style="color:${accentColor}" onclick="showProfile('${msg.author_id}')">${escHtml(msg.author_name || 'unknown')}</span>
          <span class="msg-time" title="${fullTime}">${timeStr}</span>
        </div>
        ${bodyHtml}
      </div>`;
    el.addEventListener('contextmenu', e => { e.preventDefault(); showMsgMenu(e, msg); });
    area.appendChild(el);
  }

  scrollToBottom();
}

function scrollToBottom() {
  const area = document.getElementById('messages-area');
  area.scrollTop = area.scrollHeight;
}

function escHtml(str) {
  if(!str) return '';
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/\n/g,'<br>');
}

// ---- Realtime ----
function subscribeToChannel(channelId) {
  if(messagesChannel) { sb?.removeChannel(messagesChannel); }
  if(!sb) return;
  try {
    messagesChannel = sb.channel('messages:' + channelId)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'messages',
        filter: `channel_id=eq.${channelId}`
      }, payload => {
        if(currentChannel?.id === channelId) {
          renderMessage(payload.new);
        }
      })
      .subscribe();
  } catch(e) { console.log('subscribe error:', e.message); }
}

function subscribeTyping(channelId) {
  if(typingChannel) { sb?.removeChannel(typingChannel); }
  if(!sb) return;
  try {
    typingChannel = sb.channel('typing:' + channelId)
      .on('broadcast', {event: 'typing'}, ({payload}) => {
        if(payload.user_id !== currentUser.id) {
          const el = document.getElementById('typing-indicator');
          el.textContent = payload.name + ' is typing...';
          clearTimeout(window._typingClear);
          window._typingClear = setTimeout(() => { el.textContent = ''; }, 3000);
        }
      })
      .subscribe();
  } catch(e) {}
}

function subscribeToPresence() {
  if(!sb) return;
  // Simple online tracking
  try {
    const ch = sb.channel('presence')
      .on('presence', {event: 'sync'}, () => {
        const state = ch.presenceState();
        renderMembers(state);
      })
      .subscribe(async (status) => {
        if(status === 'SUBSCRIBED') {
          await ch.track({ user_id: currentUser.id, name: currentUser.display_name, online_at: Date.now() });
        }
      });
  } catch(e) {}
}

function renderMembers(state) {
  const container = document.getElementById('members-container');
  if(!state) return;
  container.innerHTML = '';
  Object.values(state).flat().forEach(u => {
    const el = document.createElement('div');
    el.className = 'member-item';
    const init = (u.name || '?')[0].toUpperCase();
    el.innerHTML = `
      <div class="member-avatar" style="position:relative">
        <span>${init}</span>
        <div class="status-dot" style="background: var(--online)"></div>
      </div>
      <span class="member-name">${u.name || 'unknown'}</span>`;
    container.appendChild(el);
  });
}

// ---- Sending ----
async function handleMsgKey(e) {
  if(e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    await sendMsg();
  }
}

async function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text || !currentChannel) return;
  input.value = '';
  clearTimeout(typingTimer);
  await sendMessage(text);
}

function handleTyping() {
  if(!currentChannel || !sb) return;
  clearTimeout(typingTimer);
  try {
    sb.channel('typing:' + currentChannel.id).send({
      type: 'broadcast',
      event: 'typing',
      payload: { user_id: currentUser.id, name: currentUser.display_name }
    });
  } catch(e) {}
  typingTimer = setTimeout(() => {}, 2000);
}

function triggerImageUpload() {
  document.getElementById('img-upload').click();
}

async function handleImageUpload(event) {
  const file = event.target.files[0];
  if(!file || !sb || !currentChannel) return;
  try {
    const ext = file.name.split('.').pop();
    const path = `messages/${currentChannel.id}/${Date.now()}.${ext}`;
    const {data, error} = await sb.storage.from('resonance-images').upload(path, file, {upsert: true});
    if(error) throw error;
    const {data: urlData} = sb.storage.from('resonance-images').getPublicUrl(path);
    await sendMessage('', urlData.publicUrl);
  } catch(e) {
    // Fallback: read as data URL
    const reader = new FileReader();
    reader.onload = async (ev) => {
      await sendMessage('', ev.target.result);
    };
    reader.readAsDataURL(file);
  }
  event.target.value = '';
}

// ---- Modals ----
function showModal(html, onClose) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(overlay, onClose); };
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  document.getElementById('modals').appendChild(overlay);
  overlay.querySelector('.modal input, .modal select, .modal textarea')?.focus?.();
  return overlay;
}

function closeModal(overlay, onClose) {
  overlay.remove();
  if(onClose) onClose();
}

function showCreateServer() {
  const overlay = showModal(`
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    <div class="modal-title">Create Server</div>
    <div class="modal-sub">give your space a name and icon</div>
    <label class="form-label">Server Name</label>
    <input class="form-input" id="new-srv-name" placeholder="My Server" maxlength="30">
    <label class="form-label">Icon (emoji or letter)</label>
    <input class="form-input" id="new-srv-icon" placeholder="🔥" maxlength="2">
    <label class="form-label">Description (optional)</label>
    <input class="form-input" id="new-srv-desc" placeholder="what's this server about?" maxlength="100">
    <div class="modal-actions">
      <button class="btn-ghost" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="btn-fire" onclick="doCreateServer(this)">Create</button>
    </div>
  `);
}

async function doCreateServer(btn) {
  const name = document.getElementById('new-srv-name').value.trim();
  const icon = document.getElementById('new-srv-icon').value.trim();
  const desc = document.getElementById('new-srv-desc').value.trim();
  if(!name) { toast('name required'); return; }
  btn.textContent = '...';
  btn.disabled = true;
  const s = await createServer(name, icon, desc);
  btn.closest('.modal-overlay').remove();
  if(s) {
    servers.push(s);
    renderServerList();
    await selectServer(s.id);
    toast('server created ✦');
  } else {
    toast('could not create server — check Supabase tables');
  }
}

function showCreateChannel() {
  if(!currentServer) { toast('select a server first'); return; }
  showModal(`
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    <div class="modal-title">Create Channel</div>
    <label class="form-label">Channel Name</label>
    <input class="form-input" id="new-ch-name" placeholder="general" maxlength="30">
    <label class="form-label">Type</label>
    <select class="form-select" id="new-ch-type">
      <option value="text">Text Channel</option>
      <option value="voice">Voice Channel</option>
    </select>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="btn-fire" onclick="doCreateChannel(this)">Create</button>
    </div>
  `);
}

async function doCreateChannel(btn) {
  const name = document.getElementById('new-ch-name').value.trim().toLowerCase().replace(/\s+/g, '-');
  const type = document.getElementById('new-ch-type').value;
  if(!name) { toast('name required'); return; }
  btn.textContent = '...';
  btn.disabled = true;
  const ch = await createChannel(currentServer.id, name, type);
  btn.closest('.modal-overlay').remove();
  if(ch) {
    if(!serverChannels[currentServer.id]) serverChannels[currentServer.id] = [];
    serverChannels[currentServer.id].push(ch);
    renderChannelList(serverChannels[currentServer.id]);
    toast('channel created ✦');
  } else {
    toast('could not create — check Supabase tables');
  }
}

function showEditProfile() {
  const u = currentUser;
  const colors = ['#ff6b2b','#e040fb','#40c8f0','#57f287','#fee75c','#ed4245','#5865f2','#eb459e'];
  const colorSwatches = colors.map(c =>
    `<span style="background:${c}" class="${c === u.accent_color ? 'selected' : ''}" onclick="selectAccent('${c}',this)" data-color="${c}"></span>`
  ).join('');

  showModal(`
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    <div class="modal-title">Edit Profile</div>
    <div class="avatar-upload-area" id="profile-avatar-preview" onclick="document.getElementById('profile-avatar-upload').click()">
      ${u.avatar_url ? `<img src="${u.avatar_url}">` : '📷'}
    </div>
    <input type="file" id="profile-avatar-upload" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
    <label class="form-label">Display Name</label>
    <input class="form-input" id="edit-name" value="${escHtml(u.display_name)}" maxlength="24">
    <label class="form-label">Bio</label>
    <input class="form-input" id="edit-bio" value="${escHtml(u.bio || '')}" maxlength="128" placeholder="say something about yourself...">
    <label class="form-label">Status</label>
    <select class="form-select" id="edit-status">
      <option value="online" ${u.status==='online'?'selected':''}>🟢 online</option>
      <option value="idle" ${u.status==='idle'?'selected':''}>🟡 idle</option>
      <option value="dnd" ${u.status==='dnd'?'selected':''}>🔴 do not disturb</option>
      <option value="invisible" ${u.status==='invisible'?'selected':''}>⚫ invisible</option>
    </select>
    <label class="form-label">Accent Color</label>
    <div class="color-swatch">${colorSwatches}</div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="btn-fire" onclick="saveProfile(this)">Save</button>
    </div>
  `);
}

function selectAccent(color, el) {
  document.querySelectorAll('.color-swatch span').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
}

async function handleAvatarUpload(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const preview = document.getElementById('profile-avatar-preview');
    if(preview) preview.innerHTML = `<img src="${ev.target.result}">`;
    currentUser._tempAvatar = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveProfile(btn) {
  const name = document.getElementById('edit-name').value.trim();
  const bio = document.getElementById('edit-bio').value.trim();
  const status = document.getElementById('edit-status').value;
  const selectedColor = document.querySelector('.color-swatch span.selected');
  const accent = selectedColor ? selectedColor.dataset.color : currentUser.accent_color;

  if(!name) { toast('name required'); return; }

  currentUser.display_name = name;
  currentUser.bio = bio;
  currentUser.status = status;
  currentUser.accent_color = accent;
  if(currentUser._tempAvatar) {
    currentUser.avatar_url = currentUser._tempAvatar;
    delete currentUser._tempAvatar;
  }
  localStorage.setItem('resonance_user', JSON.stringify(currentUser));
  await upsertUser(currentUser);
  updateUserBar();
  btn.closest('.modal-overlay').remove();
  toast('profile saved ✦');
}

// ---- Profile popup ----
function showProfile(userId) {
  if(!userId) return;
  const popup = document.getElementById('profile-popup');
  let u;
  if(userId === currentUser.id || userId === currentUser) {
    u = currentUser;
  } else {
    u = allUsers[userId] || { display_name: String(userId).slice(0,8), bio: '', accent_color: '#ff6b2b' };
  }

  const initials = (u.display_name || '?')[0].toUpperCase();
  const avatarHtml = u.avatar_url ? `<img src="${u.avatar_url}">` : initials;
  const accentColor = u.accent_color || '#ff6b2b';

  popup.innerHTML = `
    <div class="profile-banner" style="background: linear-gradient(135deg, ${accentColor}44, var(--dark3))"></div>
    <div class="profile-popup-avatar">${avatarHtml}</div>
    <div class="profile-popup-body">
      <div class="profile-popup-name" style="color:${accentColor}">${escHtml(u.display_name)}</div>
      ${u.bio ? `<div class="profile-popup-bio">${escHtml(u.bio)}</div>` : ''}
      <div class="profile-popup-divider"></div>
      ${u.status ? `<div class="profile-popup-field">Status</div><div class="profile-popup-value">${u.status}</div>` : ''}
    </div>`;

  popup.style.display = 'block';
  popup.style.left = '50%';
  popup.style.top = '50%';
  popup.style.transform = 'translate(-50%, -50%)';

  const hide = (e) => {
    if(!popup.contains(e.target)) {
      popup.style.display = 'none';
      document.removeEventListener('click', hide);
    }
  };
  setTimeout(() => document.addEventListener('click', hide), 10);
}

// ---- Message context menu ----
function showMsgMenu(e, msg) {
  document.querySelectorAll('.msg-menu').forEach(el => el.remove());
  if(msg.author_id !== currentUser.id) return;

  const menu = document.createElement('div');
  menu.className = 'msg-menu';
  menu.style.cssText = `
    position: fixed;
    left: ${Math.min(e.clientX, window.innerWidth - 160)}px;
    top: ${Math.min(e.clientY, window.innerHeight - 80)}px;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    z-index: 700;
    width: 150px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  `;
  menu.innerHTML = `
    <div onclick="deleteMsg('${msg.id}')" style="padding:8px 10px; cursor:pointer; color:var(--dnd); font-size:13px; border-radius:4px; transition: background 0.1s;"
      onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background=''"
    >🗑 Delete Message</div>`;
  document.body.appendChild(menu);

  const hide = () => { menu.remove(); document.removeEventListener('click', hide); };
  setTimeout(() => document.addEventListener('click', hide), 10);
}

async function deleteMsg(msgId) {
  if(!sb) return;
  try {
    await sb.from('messages').delete().eq('id', msgId);
    const el = document.querySelector(`[data-msg-id="${msgId}"]`);
    if(el) el.remove();
    toast('message deleted');
  } catch(e) { toast('could not delete'); }
}

// ---- Home view ----
function renderHomeSidebar() {
  document.getElementById('sidebar-title').textContent = 'resonance';
  const list = document.getElementById('channel-list');
  list.innerHTML = `
    <div class="channel-section">
      <div class="channel-section-title"><span>Direct Messages</span><span class="add-ch">+</span></div>
    </div>`;
  showNoChatView();
}

// ---- Misc ----
function toggleMute() {
  toast('mute toggle (local only)');
}

function showSettings() {
  showEditProfile();
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// Close profile popup on escape
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    document.getElementById('profile-popup').style.display = 'none';
    document.querySelectorAll('.msg-menu').forEach(el => el.remove());
  }
});
